[project]
name = "job-hunter"
version = "0.1.0"
description = "Self-hosted job search, scoring and notification service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-jobspy>=1.1.80",
    "anthropic>=0.40",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
    "geopy>=2.4",
    "httpx>=0.27",
    "python-telegram-bot>=21",
    "discord.py>=2.4",
    "APScheduler>=3.10,<4",
    "pypdf>=4.0",
    "pandas>=2.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML",
    "pre-commit>=3.8",
]

[project.scripts]
job-hunter = "job_hunter.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_hunter"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["jobspy.*", "geopy.*", "apscheduler.*", "boto3.*", "pandas.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
