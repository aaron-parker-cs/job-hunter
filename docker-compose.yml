services:
  job-hunter:
    build:
      context: .
      args:
        WITH_AWS: "false" # "true" to include boto3 for SECRETS_BACKEND=aws_ssm
    image: job-hunter:latest
    restart: unless-stopped

    # Secrets come from .env at runtime; they are never copied into the image.
    env_file: .env
    environment:
      LOG_LEVEL: INFO

    volumes:
      # Config, resume, profile and jobs.db. The container runs as uid 10001, so on Linux:
      #   mkdir -p data && sudo chown -R 10001:10001 data
      - ./data:/data

    # Hardening
    user: "10001:10001"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

    # Outbound connections only (scraping, Anthropic, Telegram/Discord): no ports published.
    healthcheck:
      test: ["CMD", "python", "-m", "job_hunter", "healthcheck"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
